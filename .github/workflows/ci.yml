name: CI

# Quality gate for every pull request and every push to main. Until this
# landed, nothing in CI ran the tests or lint, so a regression could merge
# freely (#101). The suites gate on test / lint / type failures, emit LCOV
# coverage reports, and the "Coverage floor" step (issue #185) fails the build
# if any suite's line coverage drops below its per-suite floor
# (see scripts/check-coverage-floor.mjs — ratchet the floors up as coverage grows).
on:
  pull_request:
  push:
    branches: [main]

# Cancel an in-progress run when the same ref is pushed again (e.g. a new commit
# on a PR branch) so CI always reflects the latest commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Built before the suites, not after, so the bundle guards actually run.
      # `src/test/entryStaticImports.test.ts` (#267) asserts dist/index.html
      # does not modulepreload the editor/terminal bundles, but it *self-skips*
      # when there is no build — and CI never built, so that acceptance
      # criterion was silently unenforced. Building first makes it execute as
      # part of the normal unit run.
      - name: Build client
        run: npm run build:client

      - name: Server tests (with coverage)
        run: npm run test:server:coverage

      - name: Frontend unit tests (with coverage)
        run: npm run test:unit:coverage

      - name: Frontend component tests (with coverage)
        run: npm run test:component:coverage

      # Guard the floor gate's own LCOV parser against regressions before we
      # trust it (issue #185). Runs the script's built-in parser self-tests.
      - name: Coverage floor self-tests
        run: npm run coverage:floor:selftest

      # Separate, tunable gate (issue #185): the steps above emit LCOV reports;
      # this fails the build if any suite's line coverage drops below its floor.
      # A red "Coverage floor" is distinguishable from a red test run above.
      - name: Coverage floor
        run: npm run coverage:floor

      # Entry-chunk gate (issues #268/#269). The suites above only see runtime
      # behaviour, which stays correct while a single stray static import puts
      # all ~290 Prism grammars or the KaTeX stylesheet back on the critical
      # path. This inspects the chunks emitted by the build step above.
      - name: Entry-chunk gate self-tests
        run: npm run check:bundle:selftest

      - name: Entry-chunk gate
        run: npm run check:bundle
