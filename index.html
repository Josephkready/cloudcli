<!doctype html>

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>CloudCLI UI</title>

    <!--
      Fonts: Encode Sans (UI) + Merriweather (chat) are self-hosted from
      public/fonts and declared with @font-face in src/index.css (issue #270).
      Nothing here may point at a third-party font CDN again: a render-blocking
      external stylesheet gated first paint on the public internet being
      reachable, which is the wrong shape for a LAN/tailnet PWA.

      Only Encode Sans is preloaded — it is the UI face, needed for first paint,
      and the app's CSS is discovered a round trip later than this tag. It is a
      variable font, so this one file covers weights 400/500/600/700. Merriweather
      is the chat serif and is intentionally left out so it cannot compete with
      first paint.
    -->
    <link rel="preload" href="/fonts/encode-sans-v23-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials"  />
    
    <!-- iOS Safari PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!--
      The Apple-prefixed twin of the tag above. Current iOS understands the
      standardised name, so this is belt-and-braces rather than a fix for a
      known break — it was required historically and costs one line (issue #373).
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CloudCLI UI" />

    <!--
      iOS Safari icon. 180x180 is the size iOS actually wants for an iPhone home
      screen, and this now points at a real 180x180 file. It used to declare
      152x152 and 180x180 against two paths that were both byte-identical
      512x512 copies (issues #369/#373) — a `sizes` a file does not have is
      worse than none, because iOS picks by the declared size and then gets
      something else. iOS downscales this one link for every other slot.

      Keep at least one `rel="apple-touch-icon"` here: src/App.tsx reads icon
      link hrefs to detect the router basename behind a path-prefix proxy.
    -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180x180.png" />

    <!--
      iOS launch images (issue #373). iOS has no manifest-driven splash: without
      these an installed home-screen app shows a blank white screen for the whole
      cold start. There is one per device geometry per orientation because that
      is what iOS matches on — a near-miss simply does not apply, and the app
      falls back to the blank screen.

      GENERATED. Do not hand-edit: run `python3 scripts/generate-launch-images.py`
      and paste its output here. `src/pwa/pwaAssets.test.ts` asserts every href
      exists and is exactly the resolution its media query claims.
    -->

    <!-- Theme Color — matched to the app's own light/dark surface tokens
         (hsl(44 22% 96%) / hsl(0 0% 8%)) so the browser/OS chrome isn't a white
         flash before the app's JS runs. ThemeContext keeps these in sync with an
         explicit in-app theme choice after hydration (#371). -->
    <meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)" />
    <meta name="msapplication-TileColor" content="#141414" />
    
    <!-- Prevent zoom on iOS -->
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!--
      The service worker is registered in src/main.jsx and nowhere else (#372).
      An inline copy used to run here on `load` as well: harmless, since both
      calls resolve to the same registration for the same script and scope, but
      it meant two code paths with different logging, and the usual way that
      bites is someone "moving" registration and editing only one of them.
    -->
  </body>
